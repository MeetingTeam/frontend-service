load_module modules/ngx_otel_module.so;

events {}

http {
    include mime.types;
    default_type application/octet-stream;

    otel_exporter {
        endpoint otel-collector-ingestor.otel.svc.cluster.local:4317;
    }

    otel_service_name frontend-service;
    otel_trace on;
    otel_span_name "$request_method $uri";

    server {
        listen 80;
        root /run/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            try_files $uri =404;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}